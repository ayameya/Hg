<title>6ピン シェルコネクタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eceeea;
  --panel: #f7f8f5;
  --ink: #1d2320;
  --muted: #5f6a64;
  --line: #d3d8d2;
  --accent: #1f6b4b;
  --accent-ink: #ffffff;
  --stage-top: #f4f5f2;
  --stage-bottom: #dfe3de;
  --grid: #c3cac3;
  --edge: #2b302d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141816;
    --panel: #1b201d;
    --ink: #e4e9e5;
    --muted: #93a098;
    --line: #2d3531;
    --accent: #5fbf8f;
    --accent-ink: #0d1a13;
    --stage-top: #202724;
    --stage-bottom: #121614;
    --grid: #34403a;
    --edge: #0c0f0d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141816;
  --panel: #1b201d;
  --ink: #e4e9e5;
  --muted: #93a098;
  --line: #2d3531;
  --accent: #5fbf8f;
  --accent-ink: #0d1a13;
  --stage-top: #202724;
  --stage-bottom: #121614;
  --grid: #34403a;
  --edge: #0c0f0d;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; text-wrap: balance; letter-spacing: 0.01em; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: linear-gradient(var(--stage-top), var(--stage-bottom));
  aspect-ratio: 4 / 3;
  max-width: 100%;
  min-height: 320px;
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.axes {
  position: absolute; left: 12px; bottom: 10px;
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted);
  display: flex; gap: 10px; pointer-events: none;
}
.axes b { font-weight: 500; }
.axes .x b { color: #c2463d; } .axes .y b { color: #3f8f45; } .axes .z b { color: #3a6fc2; }
.hint {
  position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: var(--muted); pointer-events: none;
}
aside { display: flex; flex-direction: column; gap: 14px; }
.group {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.group h2 {
  margin: 0; font-size: 11px; font-weight: 500; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: inherit; font-size: 13px;
  padding: 5px 10px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.toggles { display: flex; flex-direction: column; gap: 6px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line); flex: none; }
input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.err { padding: 16px; color: var(--ink); }
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .stage { aspect-ratio: 1 / 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>6ピン シェルコネクタ</h1>
    <p>写真から採寸した近似モデル・単位 mm</p>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <div class="axes"><span class="x"><b>X</b> 幅</span><span class="y"><b>Y</b> 奥行</span><span class="z"><b>Z</b> 高さ</span></div>
      <div class="hint">ドラッグで回転・ホイール/ピンチで拡大・右ドラッグで移動</div>
    </div>
    <aside>
      <section class="group">
        <h2>視点</h2>
        <div class="seg" id="views">
          <button type="button" id="v-iso" data-view="iso" aria-pressed="true">斜め</button>
          <button type="button" id="v-front" data-view="front" aria-pressed="false">正面</button>
          <button type="button" id="v-top" data-view="top" aria-pressed="false">上面</button>
          <button type="button" id="v-bottom" data-view="bottom" aria-pressed="false">底面</button>
          <button type="button" id="v-side" data-view="side" aria-pressed="false">側面</button>
          <button type="button" id="v-rear" data-view="rear" aria-pressed="false">背面</button>
        </div>
      </section>
      <section class="group">
        <h2>表示</h2>
        <div class="toggles">
          <label for="t-shell"><input type="checkbox" id="t-shell" data-part="shell" checked><span class="swatch" style="background:#cfc9b4"></span>シェル</label>
          <label for="t-housing"><input type="checkbox" id="t-housing" data-part="housing" checked><span class="swatch" style="background:#2a2a2c"></span>ハウジング</label>
          <label for="t-contacts"><input type="checkbox" id="t-contacts" data-part="contacts" checked><span class="swatch" style="background:#e6b35a"></span>コンタクト・ピン</label>
          <label for="t-pcb"><input type="checkbox" id="t-pcb"><span class="swatch" style="background:#2f7a4f"></span>基板 (t1.6・穴位置)</label>
          <label for="t-xray"><input type="checkbox" id="t-xray"><span class="swatch" style="background:transparent"></span>シェルを半透明</label>
          <label for="t-edges"><input type="checkbox" id="t-edges" checked><span class="swatch" style="background:transparent"></span>稜線</label>
        </div>
      </section>
      <section class="group">
        <h2>主要寸法</h2>
        <dl>
          <dt>幅 × 奥行 × 高さ</dt><dd>12.8 × 12.8 × 7.8</dd>
          <dt>フランジ込み幅</dt><dd>14.2</dd>
          <dt>ピン</dt><dd>2列 × 3本</dd>
          <dt>ピンピッチ / 列間</dt><dd>2.0 / 2.0</dd>
          <dt>ピン位置 Y</dt><dd>10.2 / 12.2</dd>
          <dt>固定脚位置 Y</dt><dd>4.4 / 9.9</dd>
          <dt>ピン・脚の突出</dt><dd>2.8 (推定)</dd>
        </dl>
        <p class="note">原点は前面の幅中央・基板面。Y は前面から後方へ。</p>
      </section>
    </aside>
  </div>
</div>

(function () {
  const stage = document.getElementById("stage");
  if (!window.THREE || !THREE.OrbitControls) {
    stage.insertAdjacentHTML("afterbegin", '<p class="err">3D表示のライブラリを読み込めませんでした。ページを再読み込みしてください。</p>');
    return;
  }
  const css = () => getComputedStyle(document.documentElement);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, -200, 200);
  camera.up.set(0, 0, 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  const target = new THREE.Vector3(0, 6.4, 2.5);
  controls.target.copy(target);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9098a0, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 0.75);
  key.position.set(20, -30, 40);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3);
  fill.position.set(-30, 25, -10);
  scene.add(fill);

  function decode(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Float32Array(buf.buffer);
  }
  const specs = {
    shell: { color: 0xd8d3c2, metalness: 0.15, roughness: 0.45 },
    housing: { color: 0x2a2a2c, metalness: 0.0, roughness: 0.75 },
    contacts: { color: 0xe6b35a, metalness: 0.25, roughness: 0.35 },
  };
  const parts = {};
  const edges = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x2b302d, transparent: true, opacity: 0.55 });
  for (const name of Object.keys(specs)) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(decode(MESH[name]), 3));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ ...specs[name], side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const mesh = new THREE.Mesh(geo, mat);
    const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), edgeMat);
    const g = new THREE.Group();
    g.add(mesh, line);
    scene.add(g);
    parts[name] = { group: g, mesh, line };
    edges.push(line);
  }

  const pcb = new THREE.Group();
  const board = new THREE.Shape();
  board.moveTo(-10, -1); board.lineTo(10, -1); board.lineTo(10, 16); board.lineTo(-10, 16); board.lineTo(-10, -1);
  const holes = [];
  for (const x of [-2, 0, 2]) for (const y of [10.2, 12.2]) holes.push([x, y, 0.4]);
  for (const x of [-6.25, 6.25]) for (const y of [4.4, 9.9]) {
    const h = new THREE.Path();
    h.moveTo(x - 0.35, y - 0.9); h.lineTo(x + 0.35, y - 0.9); h.lineTo(x + 0.35, y + 0.9); h.lineTo(x - 0.35, y + 0.9); h.lineTo(x - 0.35, y - 0.9);
    board.holes.push(h);
  }
  for (const [x, y, r] of holes) { const h = new THREE.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); board.holes.push(h); }
  const boardGeo = new THREE.ExtrudeGeometry(board, { depth: 1.6, bevelEnabled: false, curveSegments: 24 });
  boardGeo.translate(0, 0, -1.6);
  const boardMesh = new THREE.Mesh(boardGeo, new THREE.MeshStandardMaterial({ color: 0x2f7a4f, roughness: 0.6, transparent: true, opacity: 0.8 }));
  pcb.add(boardMesh, new THREE.LineSegments(new THREE.EdgesGeometry(boardGeo, 20), new THREE.LineBasicMaterial({ color: 0x1b4a30 })));

  scene.add(pcb);

  const grid = new THREE.GridHelper(40, 40);
  grid.rotation.x = Math.PI / 2;
  grid.position.set(0, 6.4, -3.2);
  grid.material.transparent = true;
  grid.material.opacity = 0.6;
  scene.add(grid);

  function applyTheme() {
    const s = css();
    edgeMat.color.set(s.getPropertyValue("--edge").trim() || "#2b302d");
    const gc = new THREE.Color(s.getPropertyValue("--grid").trim() || "#c3cac3");
    const mats = Array.isArray(grid.material) ? grid.material : [grid.material];
    mats.forEach(m => m.color.copy(gc));
    grid.material.vertexColors = false;
    grid.material.needsUpdate = true;
  }
  applyTheme();
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  const views = {
    iso: [1, -1.4, 1.1],
    front: [0, -1, 0.0001],
    top: [0, -0.002, 1],
    bottom: [0, -0.002, -1],
    side: [1, 0, 0.0001],
    rear: [-0.0001, 1, 0.25],
  };
  let zoomBase = 12.5;
  function setView(name) {
    const d = new THREE.Vector3(...views[name]).normalize();
    camera.position.copy(target).addScaledVector(d, 60);
    controls.target.copy(target);
    camera.zoom = 1;
    camera.lookAt(target);
    controls.update();
    document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
  }
  document.getElementById("views").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]");
    if (b) setView(b.dataset.view);
  });
  controls.addEventListener("start", () => document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", "false")));

  document.querySelectorAll("input[data-part]").forEach(cb => cb.addEventListener("change", () => { parts[cb.dataset.part].group.visible = cb.checked; }));
  document.getElementById("t-pcb").addEventListener("change", e => { pcb.visible = e.target.checked; });
  document.getElementById("t-edges").addEventListener("change", e => { edges.forEach(l => l.visible = e.target.checked); });
  document.getElementById("t-xray").addEventListener("change", e => {
    const m = parts.shell.mesh.material;
    m.transparent = e.target.checked; m.opacity = e.target.checked ? 0.28 : 1; m.depthWrite = !e.target.checked; m.needsUpdate = true;
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    const a = w / h;
    const half = zoomBase;
    if (a >= 1) { camera.left = -half * a; camera.right = half * a; camera.top = half; camera.bottom = -half; }
    else { camera.left = -half; camera.right = half; camera.top = half / a; camera.bottom = -half / a; }
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  setView("iso");
  (function loop() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
